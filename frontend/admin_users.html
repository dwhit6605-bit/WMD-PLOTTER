<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WMD Plotter — User Management</title>
  <link rel="icon" type="image/png" href="/static/icons/icon-192.png"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d1117; --surface: #161b22; --border: #21262d;
      --text: #c9d1d9; --muted: #8b949e; --green: #00ff88;
      --accent2: #79c0ff; --warn: #f0883e; --red: #f85149;
    }
    body { min-height: 100dvh; background: var(--bg); color: var(--text); font-family: 'Courier New', monospace; }

    .topbar {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border);
    }
    .topbar-logo {
      width: 32px; height: 32px; background: var(--green);
      clip-path: polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 900; color: #000;
    }
    .topbar-title .brand { font-size: 13px; font-weight: 700; letter-spacing: 1px; }
    .topbar-title .sub   { font-size: 10px; color: var(--muted); }
    .topbar-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
    .topbar-actions a { color: var(--accent2); font-size: 12px; text-decoration: none; }
    .topbar-actions a:hover { text-decoration: underline; }

    .main { max-width: 860px; margin: 32px auto; padding: 0 16px; }

    h2 { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 20px; letter-spacing: 0.5px; }

    /* Create user card */
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 20px; margin-bottom: 24px;
    }
    .card h3 { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.8px;
               text-transform: uppercase; margin-bottom: 16px; }
    .form-row { display: flex; gap: 10px; flex-wrap: wrap; }
    input[type=text], input[type=password], select {
      background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
      color: var(--text); font-family: inherit; font-size: 13px; padding: 8px 10px;
      outline: none; flex: 1; min-width: 140px;
    }
    input:focus, select:focus { border-color: var(--green); }
    select option { background: var(--surface); }

    .btn {
      padding: 8px 16px; border-radius: 6px; border: none; font-family: inherit;
      font-size: 12px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase;
      cursor: pointer; transition: opacity .15s;
    }
    .btn:hover { opacity: .85; }
    .btn-green  { background: var(--green);  color: #000; }
    .btn-red    { background: transparent; border: 1px solid rgba(248,81,73,.4);
                  color: var(--red); padding: 5px 10px; font-size: 11px; }
    .btn-red:hover { background: rgba(248,81,73,.1); opacity: 1; }

    .msg { font-size: 12px; padding: 8px 12px; border-radius: 6px; margin-top: 12px; display: none; }
    .msg.error   { background: rgba(248,81,73,.1); border: 1px solid rgba(248,81,73,.3); color: var(--red); display: block; }
    .msg.success { background: rgba(0,255,136,.08); border: 1px solid rgba(0,255,136,.3); color: var(--green); display: block; }

    /* Users table */
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; padding: 8px 12px; font-size: 10px; font-weight: 700; color: var(--muted);
         text-transform: uppercase; letter-spacing: 0.8px; border-bottom: 1px solid var(--border); }
    td { padding: 10px 12px; border-bottom: 1px solid rgba(33,38,45,.6); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,.02); }

    .badge {
      display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 10px; font-weight: 700; letter-spacing: 0.5px;
    }
    .badge-admin { background: rgba(240,136,62,.15); color: var(--warn); border: 1px solid rgba(240,136,62,.3); }
    .badge-user  { background: rgba(121,192,255,.1);  color: var(--accent2); border: 1px solid rgba(121,192,255,.25); }

    .muted { color: var(--muted); }

    .empty { text-align: center; padding: 32px; color: var(--muted); font-size: 13px; }

    /* shared */
    input[type=number] { background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
      color: var(--text); font-family: inherit; font-size: 13px; padding: 8px 10px; outline: none; width: 100%; }
    input[type=number]:focus { border-color: var(--green); }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--muted); }
    .btn-outline:hover { border-color: var(--green); color: var(--green); opacity: 1; }
    .cert-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
      border-radius: 4px; font-size: 11px; background: rgba(0,255,136,.08);
      border: 1px solid rgba(0,255,136,.3); color: var(--green); margin-bottom: 8px; }

    /* TAK profiles */
    .profile-grid { display: flex; flex-direction: column; gap: 10px; }
    .profile-card {
      border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px;
      position: relative; transition: border-color .15s;
    }
    .profile-card.active { border-color: rgba(0,255,136,.5); background: rgba(0,255,136,.03); }
    .profile-card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
    .profile-name { font-size: 13px; font-weight: 700; color: var(--text); }
    .badge-active { padding: 2px 7px; border-radius: 4px; font-size: 10px; font-weight: 700;
      background: rgba(0,255,136,.15); color: var(--green); border: 1px solid rgba(0,255,136,.3); letter-spacing: .5px; }
    .profile-meta { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
    .profile-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
    .btn-sm { padding: 5px 11px; font-size: 11px; }

    /* Modal */
    .modal-backdrop {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,.65);
      z-index: 100; align-items: center; justify-content: center;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      padding: 24px; width: min(560px, 95vw); max-height: 90vh; overflow-y: auto;
    }
    .modal h3 { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .8px;
                text-transform: uppercase; margin-bottom: 18px; }
    .f-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 12px; }
    .f-row label { font-size: 11px; color: var(--muted); display: flex; flex-direction: column;
                   gap: 4px; flex: 1; min-width: 120px; }
    .f-row label span { letter-spacing: .5px; text-transform: uppercase; }
    .ssl-toggle { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; padding: 6px 0; }
    .ssl-toggle input { accent-color: var(--green); width: 15px; height: 15px; cursor: pointer; }
    .modal-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
    .tak-status { font-size: 11px; color: var(--muted); margin-top: 6px; }
    .tak-status.ok  { color: var(--green); }
    .tak-status.err { color: var(--red); }
  </style>
</head>
<body>

<div class="topbar">
  <div class="topbar-logo">W</div>
  <div class="topbar-title">
    <div class="brand">WHITWERX — User Management</div>
    <div class="sub">WMD Plotter Admin</div>
  </div>
  <div class="topbar-actions">
    <a href="/">← Back to App</a>
    <a href="#" onclick="doLogout()">Sign Out</a>
  </div>
</div>

<div class="main">
  <h2>User Accounts</h2>

  <!-- Create user -->
  <div class="card">
    <h3>Create User</h3>
    <div class="form-row">
      <input type="text"     id="new-user" placeholder="Username" spellcheck="false"/>
      <input type="password" id="new-pass" placeholder="Password (min 8 chars)"/>
      <select id="new-role">
        <option value="user">User</option>
        <option value="admin">Admin</option>
      </select>
      <button class="btn btn-green" onclick="createUser()">Create</button>
    </div>
    <div class="msg" id="create-msg"></div>
  </div>

  <!-- TAK Server Profiles -->
  <div class="card" id="tak-card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <h3 style="margin:0">TAK Server Profiles</h3>
      <button class="btn btn-green btn-sm" onclick="openModal()">+ Add Profile</button>
    </div>
    <div class="profile-grid" id="tak-profiles-list">
      <div class="muted" style="font-size:12px;padding:12px 0">Loading…</div>
    </div>
    <div class="msg" id="tak-msg"></div>
  </div>

  <!-- Add / Edit Profile Modal -->
  <div class="modal-backdrop" id="profile-modal" onclick="closeModal(event)">
    <div class="modal">
      <h3 id="modal-title">Add TAK Profile</h3>

      <div class="f-row">
        <label style="flex:2"><span>Profile Name</span>
          <input type="text" id="m-name" placeholder="e.g. WHITWERX TAK" spellcheck="false"/>
        </label>
      </div>
      <div class="f-row">
        <label style="flex:3"><span>Host / IP</span>
          <input type="text" id="m-host" placeholder="192.168.1.50 or tak.example.com" spellcheck="false"/>
        </label>
        <label style="max-width:100px"><span>CoT Port</span>
          <input type="number" id="m-port" value="8089" min="1" max="65535"/>
        </label>
        <label style="max-width:100px"><span>API Port</span>
          <input type="number" id="m-marti-port" value="8443" min="1" max="65535"/>
        </label>
      </div>
      <div class="f-row">
        <label style="max-width:200px"><span>Callsign</span>
          <input type="text" id="m-callsign" placeholder="WMD PLOTTER" spellcheck="false"/>
        </label>
      </div>

      <label class="ssl-toggle">
        <input type="checkbox" id="m-ssl" checked/>
        Use SSL / TLS
      </label>

      <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border)">
        <div style="font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.8px;text-transform:uppercase;margin-bottom:10px">
          Client Certificate
        </div>
        <div id="m-cert-badge"></div>
        <div class="f-row" style="margin-bottom:6px">
          <label><span>Certificate (.p12 / .pem)</span>
            <input type="file" id="m-cert-file" accept=".p12,.pfx,.pem"
                   style="background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:inherit;font-size:12px;padding:6px 8px;width:100%;cursor:pointer"
                   onchange="onModalCertFile(this)"/>
          </label>
          <label style="max-width:180px"><span>Passphrase</span>
            <input type="password" id="m-cert-pass" placeholder="(blank if none)" autocomplete="off"/>
          </label>
        </div>
        <div style="font-size:11px;color:var(--muted)">
          Same cert used for both CoT streaming (port 8089) and Marti data package push (port 8443).
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn btn-green" onclick="saveProfile()">Save Profile</button>
        <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
        <button class="btn btn-red" id="m-remove-cert-btn" style="display:none" onclick="removeCertFromModal()">Remove Cert</button>
      </div>
      <div class="tak-status" id="modal-status"></div>
    </div>
  </div>

  <!-- User list -->
  <div class="card" style="padding:0;overflow:hidden">
    <table>
      <thead>
        <tr>
          <th>Username</th>
          <th>Role</th>
          <th>Created</th>
          <th>Last Login</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="user-list">
        <tr><td colspan="5" class="empty">Loading…</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
let _me = null;

// ── Modal state ───────────────────────────────────────────────────────────────
let _editingId    = null;   // null = creating new
let _modalCertB64 = null;   // newly picked cert bytes
let _modalHasCert = false;  // cert already stored on server
let _modalClearCert = false;

async function init() {
  const r = await fetch('/auth/me');
  if (!r.ok) { location.href = '/login'; return; }
  _me = await r.json();
  loadUsers();
  loadProfiles();
}

async function loadUsers() {
  const r = await fetch('/api/admin/users');
  if (!r.ok) return;
  const d = await r.json();
  const tbody = document.getElementById('user-list');
  if (!d.users.length) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty">No users yet.</td></tr>';
    return;
  }
  tbody.innerHTML = d.users.map(u => `
    <tr>
      <td><strong>${esc(u.username)}</strong></td>
      <td><span class="badge badge-${u.role}">${u.role}</span></td>
      <td class="muted">${fmt(u.created_at)}</td>
      <td class="muted">${fmt(u.last_login) || '—'}</td>
      <td style="text-align:right">
        ${u.username !== _me?.username ? `<button class="btn btn-red" onclick="deleteUser(${u.id},'${esc(u.username)}')">Delete</button>` : ''}
      </td>
    </tr>
  `).join('');
}

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(s) { return s ? new Date(s + 'Z').toLocaleString() : ''; }

function showMsg(id, text, type) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = 'msg ' + type;
  setTimeout(() => el.className = 'msg', 4000);
}

async function createUser() {
  const username = document.getElementById('new-user').value.trim();
  const password = document.getElementById('new-pass').value;
  const role     = document.getElementById('new-role').value;
  if (!username || !password) { showMsg('create-msg', 'Username and password are required.', 'error'); return; }
  const r = await fetch('/api/admin/users', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({username, password, role}),
  });
  const d = await r.json().catch(() => ({}));
  if (r.ok) {
    showMsg('create-msg', `User "${username}" created.`, 'success');
    document.getElementById('new-user').value = '';
    document.getElementById('new-pass').value = '';
    loadUsers();
  } else {
    showMsg('create-msg', d.detail || 'Failed to create user.', 'error');
  }
}

async function deleteUser(id, name) {
  if (!confirm(`Delete user "${name}"? This cannot be undone.`)) return;
  const r = await fetch(`/api/admin/users/${id}`, {method:'DELETE'});
  if (r.ok) { loadUsers(); }
  else { const d = await r.json().catch(()=>({})); alert(d.detail || 'Delete failed.'); }
}

async function doLogout() {
  await fetch('/auth/logout', {method:'POST'});
  location.href = '/login';
}

// ── TAK Server Profiles ───────────────────────────────────────────────────────

async function loadProfiles() {
  const r = await fetch('/api/admin/tak-profiles');
  if (!r.ok) return;
  const { profiles } = await r.json();
  const el = document.getElementById('tak-profiles-list');
  if (!profiles.length) {
    el.innerHTML = '<div class="muted" style="font-size:12px;padding:12px 0">No profiles yet. Add one to get started.</div>';
    return;
  }
  el.innerHTML = profiles.map(p => `
    <div class="profile-card${p.is_active ? ' active' : ''}" id="pc-${p.id}">
      <div class="profile-card-header">
        <span class="profile-name">${esc(p.name)}</span>
        ${p.is_active ? '<span class="badge-active">ACTIVE</span>' : ''}
      </div>
      <div class="profile-meta">${esc(p.host || '(no host)')} &nbsp;·&nbsp; CoT: ${p.port}${p.ssl ? ' SSL' : ''} &nbsp;·&nbsp; API: ${p.marti_port}</div>
      <div class="profile-meta">${p.has_cert ? '🔐 Certificate loaded' : '<span style="color:var(--warn)">⚠ No certificate</span>'} &nbsp;·&nbsp; ${esc(p.callsign || 'WMD PLOTTER')}</div>
      <div class="profile-actions">
        ${!p.is_active ? `<button class="btn btn-green btn-sm" onclick="activateProfile(${p.id})">Set Active</button>` : ''}
        <button class="btn btn-outline btn-sm" onclick="testProfile(${p.id})">Test</button>
        <button class="btn btn-outline btn-sm" onclick="editProfile(${p.id})">Edit</button>
        <button class="btn btn-red btn-sm" onclick="deleteProfile(${p.id}, '${esc(p.name)}')">Delete</button>
      </div>
      <div class="tak-status" id="ts-${p.id}"></div>
    </div>
  `).join('');
}

function openModal(p = null) {
  _editingId     = p ? p.id : null;
  _modalCertB64  = null;
  _modalHasCert  = p ? !!p.has_cert : false;
  _modalClearCert = false;

  document.getElementById('modal-title').textContent = p ? 'Edit Profile' : 'Add TAK Profile';
  document.getElementById('m-name').value       = p ? p.name       : '';
  document.getElementById('m-host').value       = p ? p.host       : '';
  document.getElementById('m-port').value       = p ? p.port       : '8089';
  document.getElementById('m-marti-port').value = p ? p.marti_port : '8443';
  document.getElementById('m-callsign').value   = p ? p.callsign   : 'WMD PLOTTER';
  document.getElementById('m-ssl').checked      = p ? !!p.ssl      : true;
  document.getElementById('m-cert-file').value  = '';
  document.getElementById('m-cert-pass').value  = '';
  document.getElementById('modal-status').textContent = '';
  renderModalCertBadge();
  document.getElementById('profile-modal').classList.add('open');
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('profile-modal')) return;
  document.getElementById('profile-modal').classList.remove('open');
}

function renderModalCertBadge() {
  const badge = document.getElementById('m-cert-badge');
  const removeBtn = document.getElementById('m-remove-cert-btn');
  const hasCert = (_modalHasCert || _modalCertB64) && !_modalClearCert;
  badge.innerHTML = hasCert ? '<div class="cert-badge">🔐 Certificate loaded</div>' : '';
  removeBtn.style.display = hasCert ? '' : 'none';
}

function onModalCertFile(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    _modalCertB64  = btoa(String.fromCharCode(...new Uint8Array(e.target.result)));
    _modalClearCert = false;
    renderModalCertBadge();
  };
  reader.readAsArrayBuffer(file);
}

function removeCertFromModal() {
  _modalCertB64   = null;
  _modalClearCert = true;
  document.getElementById('m-cert-file').value = '';
  renderModalCertBadge();
}

async function saveProfile() {
  const body = {
    name:       document.getElementById('m-name').value.trim() || 'Unnamed',
    host:       document.getElementById('m-host').value.trim(),
    port:       parseInt(document.getElementById('m-port').value) || 8089,
    marti_port: parseInt(document.getElementById('m-marti-port').value) || 8443,
    callsign:   document.getElementById('m-callsign').value.trim() || 'WMD PLOTTER',
    ssl:        document.getElementById('m-ssl').checked,
  };
  if (_modalCertB64) {
    body.cert_p12_b64 = _modalCertB64;
    body.cert_pass    = document.getElementById('m-cert-pass').value;
  }
  if (_modalClearCert) body.clear_cert = true;

  const url    = _editingId ? `/api/admin/tak-profiles/${_editingId}` : '/api/admin/tak-profiles';
  const method = _editingId ? 'PUT' : 'POST';
  const r = await fetch(url, { method, headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
  if (r.ok) {
    document.getElementById('profile-modal').classList.remove('open');
    loadProfiles();
    showMsg('tak-msg', `Profile ${_editingId ? 'updated' : 'created'}.`, 'success');
  } else {
    const d = await r.json().catch(()=>({}));
    document.getElementById('modal-status').textContent = d.detail || 'Save failed.';
    document.getElementById('modal-status').className = 'tak-status err';
  }
}

async function editProfile(id) {
  const r = await fetch('/api/admin/tak-profiles');
  if (!r.ok) return;
  const { profiles } = await r.json();
  const p = profiles.find(x => x.id === id);
  if (p) openModal(p);
}

async function activateProfile(id) {
  const r = await fetch(`/api/admin/tak-profiles/${id}/activate`, { method: 'POST' });
  if (r.ok) { loadProfiles(); showMsg('tak-msg', 'Active profile updated.', 'success'); }
}

async function deleteProfile(id, name) {
  if (!confirm(`Delete profile "${name}"?`)) return;
  const r = await fetch(`/api/admin/tak-profiles/${id}`, { method: 'DELETE' });
  if (r.ok) { loadProfiles(); showMsg('tak-msg', 'Profile deleted.', 'success'); }
  else { const d = await r.json().catch(()=>({})); showMsg('tak-msg', d.detail || 'Delete failed.', 'error'); }
}

async function testProfile(id) {
  const statusEl = document.getElementById(`ts-${id}`);
  statusEl.textContent = 'Sending test marker…';
  statusEl.className   = 'tak-status';
  const r = await fetch('/api/tak-test-point', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ lat: 0, lon: 0, profile_id: id }),
  });
  const d = await r.json().catch(()=>({}));
  if (d.success) {
    statusEl.textContent = '✓ Test marker sent — look near 0°N 0°E on ATAK';
    statusEl.className   = 'tak-status ok';
  } else {
    statusEl.textContent = `✗ ${d.error || 'Failed'}`;
    statusEl.className   = 'tak-status err';
  }
  setTimeout(() => { statusEl.textContent = ''; statusEl.className = 'tak-status'; }, 12000);
}

init();
</script>
</body>
</html>
