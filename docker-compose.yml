services:

  wmd-plotter:
    build: .
    image: wmd-plotter:latest
    container_name: wmd-plotter
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env
        required: false          # App runs without .env (FIRMS key is optional)
    environment:
      PORT: "8000"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Optional: nginx reverse proxy with HTTPS ─────────────────────────────────
