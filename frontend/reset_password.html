<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WMD Plotter — Reset Password</title>
  <link rel="icon" type="image/png" href="/static/icons/icon-192.png"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#0d1117; --surface:#161b22; --border:#21262d;
      --text:#c9d1d9; --muted:#8b949e; --green:#00ff88; --red:#f85149; --warn:#f0883e;
    }
    body {
      min-height:100dvh; background:var(--bg); color:var(--text);
      font-family:'Courier New',Courier,monospace; display:flex; flex-direction:column;
    }
    .topbar {
      display:flex; align-items:center; gap:10px; padding:10px 16px;
      background:var(--surface); border-bottom:1px solid var(--border);
    }
    .topbar-logo {
      width:32px; height:32px; background:var(--green);
      clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
      display:flex; align-items:center; justify-content:center;
      font-size:14px; font-weight:900; color:#000;
    }
    .topbar-title .brand { font-size:13px; font-weight:700; letter-spacing:1px; }
    .topbar-title .sub   { font-size:10px; color:var(--muted); letter-spacing:.5px; }
    .wrap { flex:1; display:flex; align-items:center; justify-content:center; padding:24px; }
    .card {
      width:100%; max-width:420px; background:var(--surface);
      border:1px solid var(--border); border-radius:10px; overflow:hidden;
    }
    .card-hdr { padding:20px 24px; border-bottom:1px solid var(--border); text-align:center; }
    .card-hdr h1 { font-size:17px; letter-spacing:1px; }
    .card-hdr p  { font-size:11px; color:var(--muted); margin-top:5px; }
    .card-body { padding:24px; }
    label { display:block; font-size:10px; letter-spacing:.8px; color:var(--muted);
            text-transform:uppercase; margin-bottom:6px; }
    input {
      width:100%; padding:11px 12px; background:var(--bg);
      border:1px solid var(--border); border-radius:6px;
      color:var(--text); font-family:inherit; font-size:14px; margin-bottom:16px;
    }
    input:focus { outline:none; border-color:var(--green); }
    button {
      width:100%; padding:12px; background:var(--green); color:#000;
      border:none; border-radius:6px; font-family:inherit; font-size:13px;
      font-weight:700; letter-spacing:1px; text-transform:uppercase; cursor:pointer;
    }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .msg { font-size:11px; padding:11px; border-radius:6px; margin-bottom:16px;
           display:none; line-height:1.6; }
    .msg.err { display:block; background:rgba(248,81,73,.1);  border:1px solid rgba(248,81,73,.35);  color:var(--red); }
    .msg.ok  { display:block; background:rgba(0,255,136,.08); border:1px solid rgba(0,255,136,.35); color:var(--green); }
    .msg.info{ display:block; background:rgba(240,136,62,.1); border:1px solid rgba(240,136,62,.35); color:var(--warn); }
    .foot { text-align:center; margin-top:18px; font-size:11px; }
    .foot a { color:var(--muted); }
    .hint { font-size:10px; color:var(--muted); margin:-10px 0 16px; line-height:1.5; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-logo">W</div>
    <div class="topbar-title">
      <div class="brand">WHITWERX MODEL DISPLAY</div>
      <div class="sub">CBRN Planning System</div>
    </div>
  </div>

  <div class="wrap">
    <div class="card">
      <div class="card-hdr">
        <h1 id="hdr">Reset Password</h1>
        <p id="sub">Choose a new password for your account</p>
      </div>
      <div class="card-body">
        <div class="msg" id="msg"></div>
        <div id="form-area"></div>
        <div class="foot"><a href="/login">&larr; Back to sign in</a></div>
      </div>
    </div>
  </div>

<script>
// Two modes on one page:
//   ?token=...  -> set a new password
//   no token    -> ask for the reset email
const params = new URLSearchParams(location.search);
const TOKEN  = params.get('token');
const $ = id => document.getElementById(id);

function msg(text, kind) { const m = $('msg'); m.textContent = text; m.className = 'msg ' + kind; }
function clearMsg() { $('msg').className = 'msg'; }

// ── Request a link ──────────────────────────────────────────────────────────
function renderRequestForm() {
  $('hdr').textContent = 'Forgot Password';
  $('sub').textContent = 'We will email you a reset link';
  $('form-area').innerHTML = `
    <label for="ident">Username or email</label>
    <input type="text" id="ident" autocomplete="username" autocapitalize="none" spellcheck="false"/>
    <button id="btn" onclick="requestReset()">Send reset link</button>`;
  $('ident').addEventListener('keydown', e => { if (e.key === 'Enter') requestReset(); });
}

async function requestReset() {
  clearMsg();
  const ident = $('ident').value.trim();
  if (!ident) { msg('Enter your username or email.', 'err'); return; }
  const btn = $('btn');
  btn.disabled = true; btn.textContent = 'Sending…';
  try {
    const r = await fetch('/auth/forgot-password', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ identifier: ident }),
    });
    const d = await r.json().catch(() => ({}));
    // The server answers identically whether or not the account exists, so it
    // cannot be used to discover which usernames are real. Mirror that here.
    msg(d.message || 'If that account exists and has an email on file, a reset link is on its way.', 'ok');
    $('form-area').innerHTML = '<div class="hint">Check your inbox, and your spam folder. '
      + 'The link expires shortly and can be used once.</div>';
  } catch (e) {
    btn.disabled = false; btn.textContent = 'Send reset link';
    msg('Could not reach the server. Try again.', 'err');
  }
}

// ── Set a new password ──────────────────────────────────────────────────────
function renderResetForm() {
  $('form-area').innerHTML = `
    <label for="pw1">New password</label>
    <input type="password" id="pw1" autocomplete="new-password"/>
    <div class="hint">At least 8 characters.</div>
    <label for="pw2">Confirm new password</label>
    <input type="password" id="pw2" autocomplete="new-password"/>
    <button id="btn" onclick="submitReset()">Set new password</button>`;
  $('pw2').addEventListener('keydown', e => { if (e.key === 'Enter') submitReset(); });
}

async function submitReset() {
  clearMsg();
  const a = $('pw1').value, b = $('pw2').value;
  if (a.length < 8)  { msg('Password must be at least 8 characters.', 'err'); return; }
  if (a !== b)       { msg('The two passwords do not match.', 'err'); return; }
  const btn = $('btn');
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    const r = await fetch('/auth/reset-password', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: TOKEN, new_password: a }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.detail || 'Reset failed.');
    $('form-area').innerHTML = '';
    msg('Password updated. You can sign in with your new password now.', 'ok');
    setTimeout(() => location.href = '/login', 2500);
  } catch (e) {
    btn.disabled = false; btn.textContent = 'Set new password';
    msg(String(e.message || e), 'err');
  }
}

// ── Boot ────────────────────────────────────────────────────────────────────
(async function init() {
  if (!TOKEN) { renderRequestForm(); return; }
  // Check the link before asking for a password, so a dead link is not
  // discovered only after the user has typed one in twice.
  try {
    const r = await fetch('/auth/reset-password/check?token=' + encodeURIComponent(TOKEN));
    const d = await r.json();
    if (d.valid) { renderResetForm(); return; }
  } catch (e) { /* fall through to the expired message */ }
  msg('This reset link is invalid, already used, or expired.', 'info');
  $('hdr').textContent = 'Link Expired';
  $('sub').textContent = 'Request a new reset link below';
  renderRequestForm();
})();
</script>
</body>
</html>
